<title>WHO IS A GOOD BOY?</title>
<style>
  :root { --h: min(70vh, 40vw); --w: calc(var(--h) * 235 / 335); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #000; color: #bbb;
         font: 13px/1.4 Helvetica, Arial, sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; user-select: none; }
  /* sin preserve-3d: cada cara es un plano propio, el orden lo decide z-index y el navegador oculta la cara de espaldas */
  .book { position: relative; width: calc(var(--w) * 2); height: var(--h); perspective: 3000px; cursor: pointer;
          transition: transform .8s; }
  .book.closed, .book.wideR { transform: translateX(calc(var(--w) * -0.5)); }
  .book.back, .book.wideL { transform: translateX(calc(var(--w) * 0.5)); }
  /* satinado: solo al girar, un destello estrecho cruza la hoja; screen solo suma luz, no lava el color de la foto */
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(var(--ga, 110deg), transparent calc(50% - var(--gw, 10%)), #fff 50%, transparent calc(50% + var(--gw, 10%))) 0 0/300% 100%;
    background-position-x: var(--g, 0%); opacity: calc(var(--o, 0) * var(--sat, .18)); }
  /* luz cenital fija: el satinado brilla un poco más hacia el borde de arriba */
  .face::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; mix-blend-mode: screen;
    background: linear-gradient(180deg, rgba(255,255,255,var(--top, .07)), rgba(255,255,255,0) 38%); }
  .face.cov::before { --top: .1; }
  .face.cov { --sat: .28; } /* cubierta: plastificado brillo, destello algo más fuerte */
  .edge { position: absolute; top: 0; left: 50%; width: 3px; height: 100%; transform-origin: left center;
          background: linear-gradient(90deg, #cfc8b8, #f0ebe0 50%, #bdb5a4); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face { position: absolute; top: 0; left: 50%; width: var(--w); height: 100%; transform-origin: left center;
          background: #141210 center/cover; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* título en stamping dorado con relieve: sombra abajo, brillo arriba, reflejo lento */
  .gold { position: absolute; inset: 0; pointer-events: none;

<body>
<a class="logo" href="index.html">WHO IS A GOOD BOY ?</a>
<div class="book closed" id="book"></div>
<div class="bar">
  <button id="prev">←</button><span id="pg"></span><button id="next">→</button>
</div>
<div class="hint">CLIC EN LA PÁGINA O FLECHAS DEL TECLADO · 68 PÁGINAS · 235 × 335 MM</div>
<script>
const P = n => `p/${n}.jpg`;
const book = document.getElementById("book");
const TILT = "rotateX(14deg) ";
const BACK = " translateX(100%) rotateY(180deg)"; // la cara trasera ocupa el mismo sitio, girada

// Una "pieza" = dos caras planas + un ángulo animado
function piece(front, back) {
  const mk = img => { const d = document.createElement("div"); d.className = "face"; d.style.backgroundImage = `url('${img}')`; book.appendChild(d); return d; };
  return { f: mk(front), b: mk(back), from: 0, to: 0, t0: -1e9, val: 0 };
}

// Pliego de cubierta: solapa | contra | lomo | portada | solapa
const leavesImg = [[P("vacas_L"), P("pies_R")]];
for (let i = 1; i <= 67; i += 2) leavesImg.push([P(i), P(i + 1)]);
leavesImg.push([P("caballo_L"), P("sabana_R")]);
const N = leavesImg.length;
const L = leavesImg.map(([f, b]) => piece(f, b));
L[0].f.innerHTML = '<div class="gold"><i></i></div>';
// Solapas: plegadas = 180 / -180, desplegadas = 0. Plegadas no existen como pieza: se pintan en la cara de la tapa
// canto de la cubierta (papel más grueso): se ve cuando la tapa está de canto
const edges = [0, N - 1].map(i => { const e = document.createElement("div"); e.className = "edge"; book.appendChild(e); return [i, e]; });
for (const p of [L[0], L[N - 1]]) { p.f.classList.add("cov"); p.b.classList.add("cov"); }
const FF = piece(P("vacas_R"), P("pies_L"));  FF.from = FF.to = FF.val = 180;
const FB = piece(P("caballo_R"), P("sabana_L")); FB.from = FB.to = FB.val = -180;
for (const p of [FF, FB]) { p.f.classList.add("cov"); p.b.classList.add("cov"); }

const steps = [{ c: 0 }, { c: 1 }, { c: 1, fo: 1 }, { c: 1 }];
for (let c = 2; c < N; c++) steps.push({ c });
steps.push({ c: N - 1, bo: 1 }, { c: N - 1 }, { c: N });
const label = s => s.c === 0 ? "PORTADA" : s.fo ? "SOLAPA DELANTERA DESPLEGADA"
  : s.c === 1 ? "SOLAPA · 1" : s.bo ? "SOLAPA TRASERA DESPLEGADA"
  : s.c === N - 1 ? "68 · SOLAPA" : s.c === N ? "CONTRAPORTADA" : `${2 * s.c - 2} · ${2 * s.c - 1}`;

const DUR = 1000;
const now = () => window.__now ?? performance.now();
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function target(p, v) {
  if (p.to === v) return; p.from = p.val; p.to = v; p.t0 = now();
  // cada giro con su propio destello (ángulo, anchura, fuerza y desfase) para que no se repita
  if (p.f) for (const el of [p.f, p.b]) {
    el.style.setProperty("--ga", 95 + Math.random() * 40 + "deg");
    el.style.setProperty("--gw", 6 + Math.random() * 10 + "%");
  }
  p.gk = .5 + Math.random() * .6; p.go = (Math.random() - .5) * 40;
}
const moving = p => now() - p.t0 < DUR;

let k = 0;
function render() {
  const s = steps[k];
  L.forEach((p, i) => target(p, i < s.c ? -180 : 0));
  target(FF, s.fo ? 0 : 180);
  target(FB, s.bo ? 0 : -180);
  book.className = "book" + (s.c === 0 ? " closed" : s.c === N ? " back" : s.fo ? " wideL" : s.bo ? " wideR" : "");
  document.getElementById("pg").textContent = label(s);
}

function frame() {
  const t = now();
  for (const p of [...L, FF, FB]) {
    const x = Math.min(1, Math.max(0, (t - p.t0) / DUR));
    p.val = p.from + (p.to - p.from) * ease(x);
  }
  // z de dos en dos para que cada solapa quepa justo encima o debajo de su tapa
  const zs = L.map((p, i) =>
    // en el aire: la hoja más cerca de la vertical va encima (así varias a la vez no se cruzan)
    moving(p) ? 2000 + 2 * Math.round((90 - Math.abs(p.val + 90)) * 10) : p.val < -90 ? 10 + 2 * i : 10 + 2 * (2 * N - i));
  L.forEach((p, i) => {
    const tr = TILT + `rotateY(${p.val}deg)`;
    p.f.style.transform = tr; p.b.style.transform = tr + BACK;
    p.f.style.zIndex = p.b.style.zIndex = zs[i];
    const o = moving(p) ? Math.abs(Math.sin(p.val * Math.PI / 90)) * (p.gk ?? 1) : 0; // pico a 45° y 135°
    const g = 100 + (p.val < -90 ? p.val + 90 : p.val) * 100 / 90 + (p.go ?? 0) + "%";
    for (const el of [p.f, p.b]) { el.style.setProperty("--o", o); el.style.setProperty("--g", g); }
  });
  const W = book.offsetWidth / 2;
  for (const [i, e] of edges) {
    e.style.transform = TILT + `rotateY(${L[i].val}deg) translateX(${W}px) rotateY(90deg) translateX(-50%)`;
    e.style.zIndex = zs[i] + 1;
  }
  // las solapas existen siempre (nada se enciende ni apaga): van pegadas a la cara interior de su tapa,
  // encima si esa cara mira hacia ti y debajo si no. La cámara está en el lomo, así que el canto es justo a 90°
  const fr = TILT + `rotateY(${L[0].val}deg) translateX(100%) rotateY(${FF.val}deg)`;
  FF.f.style.transform = fr; FF.b.style.transform = fr + BACK;
  FF.f.style.zIndex = FF.b.style.zIndex = zs[0] + (L[0].val < -90 ? 1 : -1);
  const br = TILT + `rotateY(${L[N - 1].val}deg) translateX(100%) rotateY(${FB.val}deg)`;
  FB.f.style.transform = br; FB.b.style.transform = br + BACK;
  FB.f.style.zIndex = FB.b.style.zIndex = zs[N - 1] + (L[N - 1].val > -90 ? 1 : -1);
  requestAnimationFrame(frame);
}

function go(d) { k = Math.max(0, Math.min(steps.length - 1, k + d)); render(); }
book.addEventListener("click", e => {
  const r = book.getBoundingClientRect();
  go(e.clientX < r.left + r.width / 2 ? -1 : 1);
});
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
render(); L.forEach(p => p.t0 = -1e9); frame();
</script>
</body>
</html>
